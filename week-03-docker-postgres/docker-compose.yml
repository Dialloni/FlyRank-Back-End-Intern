services:
  db:
    image: postgres:18
    env_file: .env
    volumes:
      # Named volume = data survives `docker compose down` and restarts.
      # Postgres 18 stores data under /var/lib/postgresql (version subdir).
      - pgdata:/var/lib/postgresql
      # Runs once on first init to create + seed the table.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
